org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# AGP 8.6.0 hasn't been validated against compileSdk 36 (Android 16) yet; the platform,
# build-tools, and produced targetSdkVersion are all correct, this just silences the
# tooling warning until AGP catches up.
android.suppressUnsupportedCompileSdk=36
