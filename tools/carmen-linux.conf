# DOSBox-X config for running the original Carmen Sandiego (Linux).
# Adapted from tools/carmen.conf (macOS). Run with:
#   dosbox-x -conf tools/carmen-linux.conf
# (run from the repo root so the relative paths below resolve)
[sdl]
autolock=false
[dosbox]
machine=vgaonly
captures=work/dosbox_caps
[cpu]
core=normal
cputype=386
cycles=fixed 5000
[sblaster]
sbtype=none
[dos]
xms=true
ems=false
[render]
scaler=none
[autoexec]
mount c work/dosbox_game
c:
LOADFIX -32
CARMEN.EXE
